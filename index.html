<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Record Manager</h1>
        <p>Search, filter, sort and analyze student records</p>
    </header>


    <main>

        <!-- Controls -->
        <section class="controls">

            <div class="control-group">
                <label for="search">Search by Name</label>

                <input
                    type="text"
                    id="search"
                    placeholder="Enter student name">
            </div>


            <div class="control-group">
                <label for="courseFilter">Filter by Course</label>

                <select id="courseFilter">
                    <option value="all">All Courses</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="ME">ME</option>
                </select>
            </div>


            <div class="control-group">
                <label for="marksFilter">Minimum Marks</label>

                <input
                    type="number"
                    id="marksFilter"
                    min="0"
                    max="100"
                    placeholder="Example: 70">
            </div>


            <div class="control-group">
                <label for="sort">Sort By</label>

                <select id="sort">

                    <option value="default">
                        Default
                    </option>

                    <option value="nameAsc">
                        Name (A-Z)
                    </option>

                    <option value="nameDesc">
                        Name (Z-A)
                    </option>

                    <option value="marksAsc">
                        Marks (Low to High)
                    </option>

                    <option value="marksDesc">
                        Marks (High to Low)
                    </option>

                </select>
            </div>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h2>Total Students</h2>
                <p id="totalStudents">0</p>
            </div>


            <div class="stat-card">
                <h2>Average Marks</h2>
                <p id="averageMarks">0</p>
            </div>


            <div class="stat-card">
                <h2>Topper</h2>
                <p id="topper">-</p>
            </div>

        </section>


        <!-- Student Records -->
        <section class="records">

            <h2>Student Records</h2>

            <div id="studentList" class="student-list">
                <!-- Student records will be added using JavaScript -->
            </div>

        </section>

    </main>


    <footer>
        <p>
            Student Record Manager | LF 2026
        </p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
